<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>備份管制表單與儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 自訂隱藏與顯示的過渡效果 */
    .hidden-section { display: none; }
    /* 卡片展開的平滑過渡 */
    .target-card { transition: all 0.3s ease; }
    /* 導覽列作用中樣式 */
    .nav-active { border-bottom-width: 4px; border-color: #2563eb; color: #1d4ed8; font-weight: bold; }
    .nav-inactive { color: #6b7280; }
    .nav-inactive:hover { color: #374151; border-bottom-width: 4px; border-color: #d1d5db; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- 頂部導覽列 -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-between h-16">
        <div class="flex space-x-8 items-center">
          <div class="text-xl font-extrabold text-blue-800 tracking-wider flex items-center">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            備份管制
          </div>
          <div class="flex h-full">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-active px-3 py-2 flex items-center transition-colors duration-200">
              管理儀表板
            </button>
            <button onclick="switchTab('form')" id="tab-form" class="nav-inactive px-3 py-2 flex items-center transition-colors duration-200 ml-4">
              新增設定
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 mt-4">
    
    <!-- ==================== 儀表板視圖 ==================== -->
    <div id="dashboardView">
      
      <!-- 統計數據 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex items-center">
          <div class="p-4 rounded-full bg-blue-100 text-blue-600 mr-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
          </div>
          <div>
            <p class="text-sm text-gray-500 font-medium">總納管系統數</p>
            <p class="text-3xl font-bold text-gray-800" id="statTotal">0</p>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex items-center">
          <div class="p-4 rounded-full bg-red-100 text-red-600 mr-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          </div>
          <div>
            <p class="text-sm text-gray-500 font-medium">關鍵核心系統</p>
            <p class="text-3xl font-bold text-gray-800" id="statCritical">0</p>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex items-center">
          <div class="p-4 rounded-full bg-green-100 text-green-600 mr-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <div>
            <p class="text-sm text-gray-500 font-medium">總備份項目數</p>
            <p class="text-3xl font-bold text-gray-800" id="statTargets">0</p>
          </div>
        </div>
      </div>

      <!-- 系統列表 Header -->
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">系統備份設定一覽</h2>
        <div class="flex items-center gap-3">
          <button id="generateDocBtn" onclick="generateBackupFormDoc()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2 px-4 rounded-lg shadow-sm transition">
            一鍵生成表單
          </button>
          <div class="relative">
            <input type="text" id="searchInput" placeholder="搜尋系統名稱..." onkeyup="renderDashboard()" class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm w-64">
            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
        </div>
      </div>

      <!-- 儀表板載入進度 -->
      <div id="dashboardLoading" class="hidden mb-4 p-3 bg-white border border-blue-100 rounded-lg" aria-live="polite">
        <div class="flex justify-between items-center text-sm text-blue-700 mb-2">
          <span>載入中...</span>
          <span id="dashboardLoadingText">0%</span>
        </div>
        <div class="w-full h-2 bg-blue-100 rounded-full overflow-hidden">
          <div
            id="dashboardLoadingBar"
            class="h-full bg-blue-600 transition-all duration-200"
            style="width: 0%;"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>
      </div>

      <!-- 系統卡片網格 -->
      <div id="systemCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS 將在此處渲染系統卡片 -->
      </div>
      
      <!-- 無資料時的空狀態 -->
      <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-xl shadow-sm border border-gray-200">
        <svg class="w-20 h-20 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
        <h3 class="text-lg font-medium text-gray-900">目前尚無備份設定</h3>
        <p class="text-gray-500 mt-1 mb-6">點擊上方「新增設定」開始建立第一筆紀錄。</p>
        <button onclick="switchTab('form')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition">
          立即新增
        </button>
      </div>
    </div>


    <!-- ==================== 表單視圖 ==================== -->
    <div id="formView" class="hidden">
      <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
          <h2 id="formTitle" class="text-2xl font-bold text-gray-800">新增備份管制設定單</h2>
          <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition">
            取消編輯並返回
          </button>
        </div>
        
        <form id="backupForm" onsubmit="handleFormSubmit(event)">
          <datalist id="systemOptionsList"></datalist>
          <datalist id="assetOptionsList"></datalist>

          <!-- 隱藏識別欄位：submissionId 對應 U 欄，sourceSystemId 對應 B 欄 -->
          <input type="hidden" id="submissionId" value="">
          <input type="hidden" id="sourceSystemId" value="">
          
          <!-- 第一區：系統基本資訊 -->
          <div class="mb-8 p-5 bg-blue-50 rounded-xl border border-blue-100">
            <h3 class="text-lg font-semibold text-blue-800 mb-4">1. 系統基本資訊</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div>
                <div class="mb-2 flex items-center space-x-4 text-sm font-medium text-gray-700">
                  <span>來源：</span>
                  <label class="inline-flex items-center">
                    <input type="radio" name="sourceType" value="systems" class="form-radio text-blue-600" checked onchange="handleSourceChange(true)">
                    <span class="ml-1">系統清冊</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="sourceType" value="assets" class="form-radio text-blue-600" onchange="handleSourceChange(true)">
                    <span class="ml-1">資訊資產清單</span>
                  </label>
                </div>
                <label class="block text-sm font-medium text-gray-700">系統 / 資訊資產</label>
                <input type="text" id="systemName" list="systemOptionsList" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" onchange="handleSystemNameInput()">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">系統屬性</label>
                <select id="systemLevel" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500" onchange="renderAssetOptionsDatalist()">
                  <option value="">請選擇 (或由系統名稱帶入)</option>
                  <option value="關鍵核心系統">關鍵核心系統</option>
                  <option value="一般系統">一般系統</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">系統管理人員</label>
                <input type="text" id="managerName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500">
              </div>
            </div>
          </div>

          <!-- 第二區：備份標的清單 -->
          <div class="mb-8">
            <div class="flex justify-between items-end mb-4">
              <h3 class="text-lg font-semibold text-gray-800">2. 備份標的設定 (請依序確認)</h3>
              <p class="text-xs text-gray-500">展開擁有的標的並填寫，若無該標的請保持未勾選狀態。</p>
            </div>
            
            <!-- 卡片容器 -->
            <div id="targetsContainer" class="space-y-4">
              <!-- JS 將在此處渲染所有備份標的卡片 -->
            </div>
          </div>

          <!-- 送出按鈕 -->
          <div class="flex justify-end pt-4 border-t border-gray-200">
            <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-lg shadow-md transition duration-200 focus:ring-4 focus:ring-blue-300">
              儲存並送出紀錄
            </button>
          </div>
          
          <!-- 訊息提示 -->
          <div id="statusMessage" class="mt-4 text-center hidden p-3 rounded-md font-medium"></div>
        </form>
      </div>
    </div>

  </main>

  <script>
    const DISPOSITION_METHOD_OPTIONS = ['磁碟自動覆寫', '人工手動覆蓋'];
    const EVIDENCE_REQUIREMENT_OPTIONS = ['備份系統執行Log', '備份檔名確認'];

    function renderChoiceSelectHtml_(id, options, className) {
      const optionHtml = options.map(function(value, index) {
        return `<option value="${value}"${index === 0 ? ' selected' : ''}>${value}</option>`;
      }).join('');
      return `<select id="${id}" class="${className}" onchange="handleChoiceSelectChange_(this)">${optionHtml}</select>`;
    }

    function removeLegacyChoiceOptions_(selectEl) {
      if (!selectEl || typeof selectEl.querySelectorAll !== 'function') return;
      Array.from(selectEl.querySelectorAll('option[data-legacy-option="true"]')).forEach(function(option) {
        option.remove();
      });
    }

    function setChoiceSelectValue_(selectEl, rawValue, fallbackValue) {
      if (!selectEl) return;
      removeLegacyChoiceOptions_(selectEl);

      const value = String(rawValue || '').trim();
      const fallback = String(fallbackValue || '').trim();
      const hasKnownOption = Array.from(selectEl.options || []).some(function(option) {
        return option.value === value;
      });

      if (value && value !== '無' && !hasKnownOption) {
        const legacyOption = document.createElement('option');
        legacyOption.value = value;
        legacyOption.textContent = value + '（舊值）';
        legacyOption.dataset.legacyOption = 'true';
        selectEl.appendChild(legacyOption);
      }
      selectEl.value = value && value !== '無' ? value : fallback;
    }

    function handleChoiceSelectChange_(selectEl) {
      if (!selectEl) return;
      const selectedOption = Array.from(selectEl.options || []).find(function(option) {
        return option.value === selectEl.value;
      });
      if (selectedOption && selectedOption.dataset && selectedOption.dataset.legacyOption === 'true') return;
      removeLegacyChoiceOptions_(selectEl);
    }

    function resetChoiceSelect_(selectEl, defaultValue) {
      if (!selectEl) return;
      removeLegacyChoiceOptions_(selectEl);
      selectEl.value = defaultValue;
    }

    // --- 排程時間標準語法核心引擎 ---
    function formatTrackSchedule(unit, time, options = {}) {
      const u = String(unit || '天').trim();
      const t = String(time || '00:00').trim();
      if (u === '版本') return '每次版本發布';
      if (u === '天') return `每日 ${t}`;
      if (u === '週') {
        const w = options.weekday || '日';
        return `每週${w} ${t}`;
      }
      if (u === '個月') {
        const d = options.day || '1';
        return d === '月底最後一日' ? `每月月底最後一日 ${t}` : `每月 ${d} 日 ${t}`;
      }
      if (u === '年') {
        const m = options.month || '12';
        const d = options.day || '31';
        return d === '月底最後一日' ? `每年 ${m} 月月底最後一日 ${t}` : `每年 ${m} 月 ${d} 日 ${t}`;
      }
      return `每日 ${t}`;
    }

    function composeDualTrackSchedule(options = {}) {
      const hasDiff = Boolean(options.hasDiff);
      const fullStr = String(options.fullSchedule || '').trim();
      const diffStr = hasDiff ? String(options.diffSchedule || '').trim() : '';

      if (hasDiff && fullStr && diffStr) {
        return `完整:${fullStr} / 差異:${diffStr}`;
      }
      if (fullStr) return fullStr;
      if (diffStr) return diffStr;
      return '每日 00:00';
    }

    function parseScheduleString(scheduleStr, defaultUnit = '天') {
      const raw = String(scheduleStr || '').trim();
      const result = {
        isDual: false,
        full: { time: '00:00', weekday: '日', month: '12', day: '1' },
        diff: { time: '00:00', weekday: '日', month: '12', day: '1' }
      };

      if (!raw) return result;

      const dualMatch = raw.match(/^完整:(.*?)\s*\/\s*差異:(.*)$/);
      if (dualMatch) {
        result.isDual = true;
        result.full = parseSingleScheduleSegment_(dualMatch[1].trim(), defaultUnit);
        result.diff = parseSingleScheduleSegment_(dualMatch[2].trim(), '天');
        return result;
      }

      result.full = parseSingleScheduleSegment_(raw, defaultUnit);
      return result;
    }

    function parseSingleScheduleSegment_(seg, unit) {
      const segment = String(seg || '').trim();
      const parsed = { time: '00:00', weekday: '日', month: '12', day: '1' };

      // 1. 提取時間 HH:mm
      const timeMatch = segment.match(/(?:^|[^\d])([01]?\d|2[0-3]):([0-5]\d)(?::\d{2})?(?:[^\d]|$)/);
      if (timeMatch) {
        const h = timeMatch[1].padStart(2, '0');
        const m = timeMatch[2].padStart(2, '0');
        parsed.time = `${h}:${m}`;
      }

      // 2. 提取星期
      const weekMatch = segment.match(/每?週([一二三四五六日])/);
      if (weekMatch) parsed.weekday = weekMatch[1];

      // 3. 提取月份與日期
      if (segment.includes('月底最後一日')) {
        parsed.day = '月底最後一日';
      } else {
        const dayMatch = segment.match(/每?月\s*([0-3]?\d)\s*日/);
        if (dayMatch) parsed.day = String(parseInt(dayMatch[1], 10));
      }

      const yearMatch = segment.match(/每?年\s*([0-1]?\d)\s*月/);
      if (yearMatch) parsed.month = String(parseInt(yearMatch[1], 10));

      return parsed;
    }

    function setVisible_(el, visible) {
      if (!el) return;
      if (visible) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    function renderSchedulePickerTrackHtml(targetId, track, title) {
      const isOffsite = track === 'offsite';
      const isDiff = track === 'diff';
      const labelColor = isOffsite ? 'text-purple-700' : 'text-gray-500';
      const borderColor = isOffsite ? 'border-purple-300' : 'border-gray-300';
      const versionTagBg = isOffsite ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800';
      const hiddenClass = isDiff ? ' hidden' : '';
      const displayTitle = title ? (title.endsWith(':') || title.endsWith('：') ? title : title + ':') : '';

      let monthOptions = '';
      for (let m = 1; m <= 12; m++) {
        monthOptions += `<option value="${m}"${m === 12 ? ' selected' : ''}>${m} 月</option>`;
      }

      let dayOptions = '';
      for (let d = 1; d <= 31; d++) {
        dayOptions += `<option value="${d}"${d === 1 ? ' selected' : ''}>${d} 日</option>`;
      }
      dayOptions += `<option value="月底最後一日">月底最後一日</option>`;

      const weekdayOptions = `
        <option value="日" selected>每週日</option>
        <option value="一">每週一</option>
        <option value="二">每週二</option>
        <option value="三">每週三</option>
        <option value="四">每週四</option>
        <option value="五">每週五</option>
        <option value="六">每週六</option>
      `;

      return `
        <div id="${track}SchedulePicker_${targetId}" class="schedule-picker-track flex flex-wrap items-center gap-2${hiddenClass}">
          <span class="text-xs font-semibold ${labelColor} w-16">${displayTitle}</span>
          <span id="${track}SchedPrefix_${targetId}" class="prefix-label text-sm text-gray-700">每日</span>
          <select id="${track}SchedMonth_${targetId}" class="hidden sched-month rounded-md ${borderColor} p-1.5 text-sm" onchange="syncTargetSchedule('${targetId}')">
            ${monthOptions}
          </select>
          <select id="${track}SchedDay_${targetId}" class="hidden sched-day rounded-md ${borderColor} p-1.5 text-sm" onchange="syncTargetSchedule('${targetId}')">
            ${dayOptions}
          </select>
          <select id="${track}SchedWeekday_${targetId}" class="hidden sched-weekday rounded-md ${borderColor} p-1.5 text-sm" onchange="syncTargetSchedule('${targetId}')">
            ${weekdayOptions}
          </select>
          <input type="time" id="${track}SchedTime_${targetId}" class="sched-time rounded-md ${borderColor} p-1.5 text-sm" value="00:00" oninput="syncTargetSchedule('${targetId}')" onchange="syncTargetSchedule('${targetId}')">
          <span id="${track}SchedVersionTag_${targetId}" class="hidden text-xs ${versionTagBg} px-2 py-1 rounded">每次版本發布</span>
        </div>
      `;
    }

    function updateSchedulePickerUI(targetId, track, unit) {
      const u = String(unit || '天').trim();
      const prefixEl = document.getElementById(`${track}SchedPrefix_${targetId}`);
      const monthEl = document.getElementById(`${track}SchedMonth_${targetId}`);
      const dayEl = document.getElementById(`${track}SchedDay_${targetId}`);
      const weekdayEl = document.getElementById(`${track}SchedWeekday_${targetId}`);
      const timeEl = document.getElementById(`${track}SchedTime_${targetId}`);
      const versionTagEl = document.getElementById(`${track}SchedVersionTag_${targetId}`);

      if (u === '週') {
        if (prefixEl) {
          prefixEl.textContent = '';
          setVisible_(prefixEl, false);
        }
        setVisible_(monthEl, false);
        setVisible_(dayEl, false);
        setVisible_(weekdayEl, true);
        setVisible_(timeEl, true);
        setVisible_(versionTagEl, false);
      } else if (u === '個月') {
        if (prefixEl) {
          prefixEl.textContent = '每月';
          setVisible_(prefixEl, true);
        }
        if (dayEl && (dayEl.value === '31' || !dayEl.value)) dayEl.value = '1';
        setVisible_(monthEl, false);
        setVisible_(dayEl, true);
        setVisible_(weekdayEl, false);
        setVisible_(timeEl, true);
        setVisible_(versionTagEl, false);
      } else if (u === '年') {
        if (prefixEl) {
          prefixEl.textContent = '每年';
          setVisible_(prefixEl, true);
        }
        if (monthEl && !monthEl.value) monthEl.value = '12';
        if (dayEl && (dayEl.value === '1' || !dayEl.value)) dayEl.value = '31';
        setVisible_(monthEl, true);
        setVisible_(dayEl, true);
        setVisible_(weekdayEl, false);
        setVisible_(timeEl, true);
        setVisible_(versionTagEl, false);
      } else if (u === '版本') {
        if (prefixEl) {
          prefixEl.textContent = '';
          setVisible_(prefixEl, false);
        }
        setVisible_(monthEl, false);
        setVisible_(dayEl, false);
        setVisible_(weekdayEl, false);
        setVisible_(timeEl, false);
        setVisible_(versionTagEl, true);
      } else {
        // 預設為天
        if (prefixEl) {
          prefixEl.textContent = '每日';
          setVisible_(prefixEl, true);
        }
        setVisible_(monthEl, false);
        setVisible_(dayEl, false);
        setVisible_(weekdayEl, false);
        setVisible_(timeEl, true);
        setVisible_(versionTagEl, false);
      }
    }

    function updateDiffPickerVisibility(targetId) {
      const diffValInput = document.getElementById(`diffValue_${targetId}`);
      const diffPicker = document.getElementById(`diffSchedulePicker_${targetId}`);
      const val = parseFloat(diffValInput ? diffValInput.value : 0) || 0;
      if (diffPicker) {
        if (val > 0) {
          diffPicker.classList.remove('hidden');
        } else {
          diffPicker.classList.add('hidden');
        }
      }
      syncTargetSchedule(targetId);
    }

    function syncTargetSchedule(targetId) {
      if (targetId === 'log') {
        const timeEl = document.getElementById(`fullSchedTime_${targetId}`);
        const time = timeEl ? timeEl.value.trim() : '00:00';
        const localStr = formatTrackSchedule('天', time, {});
        const localInput = document.getElementById(`localScheduleTime_${targetId}`);
        if (localInput) localInput.value = localStr;
        const localPreview = document.getElementById(`localSchedulePreview_${targetId}`);
        if (localPreview) localPreview.textContent = `排程設定值: ${localStr}`;
      } else {
        // 完整備份軌
        const fullUnitEl = document.getElementById(`fullUnit_${targetId}`);
        const fullUnit = fullUnitEl ? fullUnitEl.value : '天';
        const fullTimeEl = document.getElementById(`fullSchedTime_${targetId}`);
        const fullTime = fullTimeEl ? fullTimeEl.value.trim() : '00:00';
        const fullWeekdayEl = document.getElementById(`fullSchedWeekday_${targetId}`);
        const fullWeekday = fullWeekdayEl ? fullWeekdayEl.value : '日';
        const fullMonthEl = document.getElementById(`fullSchedMonth_${targetId}`);
        const fullMonth = fullMonthEl ? fullMonthEl.value : '12';
        const fullDayEl = document.getElementById(`fullSchedDay_${targetId}`);
        const fullDay = fullDayEl ? fullDayEl.value : '1';

        const fullSchedule = formatTrackSchedule(fullUnit, fullTime, {
          weekday: fullWeekday,
          month: fullMonth,
          day: fullDay
        });

        // 差異備份軌
        const diffValEl = document.getElementById(`diffValue_${targetId}`);
        const diffVal = parseFloat(diffValEl ? diffValEl.value : 0) || 0;
        const hasDiff = diffVal > 0;
        let diffSchedule = '';
        if (hasDiff) {
          const diffUnitEl = document.getElementById(`diffUnit_${targetId}`);
          const diffUnit = diffUnitEl ? diffUnitEl.value : '天';
          const diffTimeEl = document.getElementById(`diffSchedTime_${targetId}`);
          const diffTime = diffTimeEl ? diffTimeEl.value.trim() : '00:00';
          const diffWeekdayEl = document.getElementById(`diffSchedWeekday_${targetId}`);
          const diffWeekday = diffWeekdayEl ? diffWeekdayEl.value : '日';
          const diffMonthEl = document.getElementById(`diffSchedMonth_${targetId}`);
          const diffMonth = diffMonthEl ? diffMonthEl.value : '12';
          const diffDayEl = document.getElementById(`diffSchedDay_${targetId}`);
          const diffDay = diffDayEl ? diffDayEl.value : '1';

          diffSchedule = formatTrackSchedule(diffUnit, diffTime, {
            weekday: diffWeekday,
            month: diffMonth,
            day: diffDay
          });
        }

        const localStr = composeDualTrackSchedule({
          hasDiff,
          fullSchedule,
          diffSchedule
        });

        const localInput = document.getElementById(`localScheduleTime_${targetId}`);
        if (localInput) localInput.value = localStr;
        const localPreview = document.getElementById(`localSchedulePreview_${targetId}`);
        if (localPreview) localPreview.textContent = `排程設定值: ${localStr}`;
      }

      // 異地存放軌 (所有標的包含 log 皆適用)
      const offsiteUnitEl = document.getElementById(`offsiteFreqUnit_${targetId}`);
      const offsiteUnit = offsiteUnitEl ? offsiteUnitEl.value : '天';
      const offsiteTimeEl = document.getElementById(`offsiteSchedTime_${targetId}`);
      const offsiteTime = offsiteTimeEl ? offsiteTimeEl.value.trim() : '00:00';
      const offsiteWeekdayEl = document.getElementById(`offsiteSchedWeekday_${targetId}`);
      const offsiteWeekday = offsiteWeekdayEl ? offsiteWeekdayEl.value : '日';
      const offsiteMonthEl = document.getElementById(`offsiteSchedMonth_${targetId}`);
      const offsiteMonth = offsiteMonthEl ? offsiteMonthEl.value : '12';
      const offsiteDayEl = document.getElementById(`offsiteSchedDay_${targetId}`);
      const offsiteDay = offsiteDayEl ? offsiteDayEl.value : '1';

      const offsiteStr = formatTrackSchedule(offsiteUnit, offsiteTime, {
        weekday: offsiteWeekday,
        month: offsiteMonth,
        day: offsiteDay
      });

      const offsiteInput = document.getElementById(`offsiteScheduleTime_${targetId}`);
      if (offsiteInput) offsiteInput.value = offsiteStr;
      const offsitePreview = document.getElementById(`offsiteSchedulePreview_${targetId}`);
      if (offsitePreview) offsitePreview.textContent = `排程設定值: ${offsiteStr}`;
    }

    // --- 狀態管理（Single Source of Truth：完全以 Google Sheet 後端為主，不使用本地快取）---
    let appData = [];
    let systemOptionsData = [];
    let assetOptionsData = [];
    let dashboardLoadProgress = 0;
    let dashboardLoadTimer = null;
    let dashboardLoadError = null;

    // --- 安全工具：避免將使用者輸入直接注入 innerHTML ---
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeText(value, fallback = '未填寫') {
      const text = String(value ?? '').trim();
      return text ? escapeHtml(text) : fallback;
    }

    function formatCycle(value, unit) {
      const v = String(value ?? '').trim();
      const u = String(unit ?? '').trim();
      if (!v || v === 'N/A' || v === '無') return '無';
      return escapeHtml(u ? `${v} ${u}` : v);
    }

    function formatRetention(value) {
      const v = String(value ?? '').trim();
      if (v === 'ALL' || v === '全部保留') return '全部保留';
      if (!v || v === 'N/A' || v === '無') return '無';
      return escapeHtml(v.endsWith('代') || v.includes('保存') ? v : `${v} 代`);
    }

    function renderTargetSetting(target) {
      const name = safeText(target.targetName, '未命名標的');
      const isLogTarget = String(target.targetName || '').trim() === '系統日誌檔';
      const offsiteEnabled = String(target.isOffsite || '').trim() === '是';

      const localDiff = isLogTarget ? '不適用' : formatCycle(target.localDiffValue, target.localDiffUnit);
      const localFull = isLogTarget ? '不適用' : formatCycle(target.localFullValue, target.localFullUnit);
      const localRetention = isLogTarget
        ? safeText(target.logRetention, '無')
        : formatRetention(target.localRetention);
      const localLocation = safeText(target.localLocation, '未填寫');
      const localSchedule = safeText(target.localScheduleTime, '每日 00:00');
      const localDisp = safeText(target.localDispositionMethod, '磁碟自動覆寫');
      const localEvid = safeText(target.localEvidenceRequirements, '備份系統執行Log');

      const offsiteCycle = isLogTarget ? '不適用' : (offsiteEnabled ? formatCycle(target.offsiteFreqValue, target.offsiteFreqUnit) : '無');
      const offsiteLocation = offsiteEnabled ? safeText(target.offsiteLocation, '未填寫') : '無';
      const offsiteRetention = isLogTarget ? '不適用' : (offsiteEnabled ? formatRetention(target.offsiteRetention) : '無');
      const offsiteSchedule = offsiteEnabled ? safeText(target.offsiteScheduleTime, '每日 00:00') : '無';
      const offsiteDisp = offsiteEnabled ? safeText(target.offsiteDispositionMethod, '磁碟自動覆寫') : '無';
      const offsiteEvid = offsiteEnabled ? safeText(target.offsiteEvidenceRequirements, '備份系統執行Log') : '無';

      const localHtml = [
        '<div class="rounded-lg border border-slate-200 bg-slate-50/80 p-2.5">',
        '  <div class="flex items-center space-x-1.5 mb-2 pb-1.5 border-b border-slate-200/70">',
        '    <span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>',
        '    <span class="text-xs font-bold text-slate-800 tracking-wide">本地備份</span>',
        '  </div>',
        '  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-1 text-xs text-slate-700">',
        '    <div><span class="text-slate-500">完整週期：</span>' + localFull + '</div>',
        '    <div><span class="text-slate-500">差異週期：</span>' + localDiff + '</div>',
        '    <div><span class="text-slate-500">保留代數：</span>' + localRetention + '</div>',
        '    <div><span class="text-slate-500">存放設備：</span>' + localLocation + '</div>',
        '    <div class="sm:col-span-2"><span class="text-slate-500">排程時間：</span>' + localSchedule + '</div>',
        '    <div class="sm:col-span-2"><span class="text-slate-500">到期銷毀方法：</span>' + localDisp + '</div>',
        '    <div class="sm:col-span-2"><span class="text-slate-500">銷毀確認方式：</span>' + localEvid + '</div>',
        '  </div>',
        '</div>'
      ].join('');

      let offsiteHtml = '';
      if (offsiteEnabled) {
        offsiteHtml = [
          '<div class="rounded-lg border border-purple-200 bg-purple-50/70 p-2.5">',
          '  <div class="flex items-center space-x-1.5 mb-2 pb-1.5 border-b border-purple-200/70">',
          '    <span class="w-2 h-2 rounded-full bg-purple-600 inline-block"></span>',
          '    <span class="text-xs font-bold text-purple-900 tracking-wide">異地備份</span>',
          '  </div>',
          '  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-1 text-xs text-purple-900">',
          '    <div><span class="text-purple-600 font-medium">備份週期：</span>' + offsiteCycle + '</div>',
          '    <div><span class="text-purple-600 font-medium">保留代數：</span>' + offsiteRetention + '</div>',
          '    <div class="sm:col-span-2"><span class="text-purple-600 font-medium">存放地點：</span>' + offsiteLocation + '</div>',
          '    <div class="sm:col-span-2"><span class="text-purple-600 font-medium">排程時間：</span>' + offsiteSchedule + '</div>',
          '    <div class="sm:col-span-2"><span class="text-purple-600 font-medium">到期銷毀方法：</span>' + offsiteDisp + '</div>',
          '    <div class="sm:col-span-2"><span class="text-purple-600 font-medium">銷毀確認方式：</span>' + offsiteEvid + '</div>',
          '  </div>',
          '</div>'
        ].join('');
      } else {
        offsiteHtml = [
          '<div class="rounded-lg border border-dashed border-gray-200 bg-gray-50/60 py-2 px-3 flex items-center justify-between text-xs text-gray-500">',
          '  <div class="flex items-center space-x-1.5">',
          '    <span class="w-2 h-2 rounded-full bg-gray-300 inline-block"></span>',
          '    <span class="font-medium text-gray-600">未啟用異地備份</span>',
          '  </div>',
          '  <span class="text-[11px] text-gray-400">僅本地保存</span>',
          '</div>'
        ].join('');
      }

      return [
        '<div class="rounded-xl border border-gray-200 bg-white p-3 mb-2.5 shadow-sm">',
        '  <div class="text-sm font-bold text-gray-800 mb-2">' + name + '</div>',
        '  <div class="flex flex-col gap-2">',
        localHtml,
        offsiteHtml,
        '  </div>',
        '</div>'
      ].join('');
    }

    // --- 系統所有的備份標的清單 (設定檔) ---
    const backupTargets = [
      { id: 'config', name: '設定檔' },
      { id: 'source', name: '原始碼' },
      { id: 'db', name: '資料庫' },
      { id: 'log', name: '系統日誌檔' },
      { id: 'image', name: '整體影像備份' },
      { id: 'other', name: '其他' }
    ];

    // --- 初始化應用程式 ---
    document.addEventListener('DOMContentLoaded', () => {
      try {
        localStorage.removeItem('isms_backup_records');
      } catch (e) {}
      renderFormTargets();
      loadAssetOptions();
      loadDashboardData({ showProgress: true });
    });

    function handleSourceChange(isUserAction = false) {
      const sourceRadio = document.querySelector('input[name="sourceType"]:checked');
      if (!sourceRadio) return;
      
      const sysNameInput = document.getElementById('systemName');
      if (sysNameInput) {
        sysNameInput.setAttribute('list', sourceRadio.value === 'systems' ? 'systemOptionsList' : 'assetOptionsList');
        if (isUserAction) {
          sysNameInput.value = '';
        }
      }
    }

    function renderAssetOptionsDatalist() {
      const sysList = document.getElementById('systemOptionsList');
      const astList = document.getElementById('assetOptionsList');
      const levelSelect = document.getElementById('systemLevel');
      const filterLevel = levelSelect ? levelSelect.value : '';
      
      if (sysList) {
        sysList.innerHTML = '';
        const filteredSys = filterLevel ? systemOptionsData.filter(item => item.level === filterLevel) : systemOptionsData;
        filteredSys.forEach(item => {
          const option = document.createElement('option');
          option.value = item.name;
          sysList.appendChild(option);
        });
      }
      
      if (astList) {
        astList.innerHTML = '';
        const filteredAst = filterLevel ? assetOptionsData.filter(item => item.level === filterLevel) : assetOptionsData;
        filteredAst.forEach(item => {
          const option = document.createElement('option');
          option.value = item.name;
          astList.appendChild(option);
        });
      }
      
      handleSourceChange(false);
    }

    function loadAssetOptions() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.success && response.data) {
              systemOptionsData = response.data.systems || [];
              assetOptionsData = response.data.assets || [];
            } else {
              systemOptionsData = [];
              assetOptionsData = [];
            }
            renderAssetOptionsDatalist();
          })
          .withFailureHandler(function() {
            systemOptionsData = [];
            assetOptionsData = [];
            renderAssetOptionsDatalist();
          })
          .getAssetOptions();
      } else {
        // 本地測試時沒有 Apps Script 後端，保留空清單
        systemOptionsData = [];
        assetOptionsData = [];
        renderAssetOptionsDatalist();
      }
    }

    function generateBackupFormDoc() {
      const btn = document.getElementById('generateDocBtn');
      if (!btn) return;

      const originalText = btn.innerText;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.innerText = '產生中...';

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(response) {
            btn.disabled = false;
            btn.classList.remove('opacity-60', 'cursor-not-allowed');
            btn.innerText = originalText;

            if (!response || !response.success) {
              alert((response && response.message) ? response.message : '表單生成失敗。');
              return;
            }

            const message = `文件已生成（紀錄編號：${response.recordNo || '-'}）`;
            alert(message);
            if (response.url) {
              window.open(response.url, '_blank');
            }
          })
          .withFailureHandler(function(error) {
            btn.disabled = false;
            btn.classList.remove('opacity-60', 'cursor-not-allowed');
            btn.innerText = originalText;
            alert('生成文件失敗：' + (error && error.message ? error.message : '未知錯誤'));
          })
          .generateBackupControlDocument();
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        btn.innerText = originalText;
        alert('目前不在 Apps Script 環境，無法生成文件。');
      }
    }

    function handleSystemNameInput() {
      const inputVal = document.getElementById('systemName').value.trim();
      if (!inputVal) return;

      const sourceRadio = document.querySelector('input[name="sourceType"]:checked');
      if (!sourceRadio) return;
      
      const targetData = sourceRadio.value === 'systems' ? systemOptionsData : assetOptionsData;
      
      const matched = targetData.find(item => item.name === inputVal);
      const sourceSystemIdEl = document.getElementById('sourceSystemId');
      if (!matched) {
        if (sourceSystemIdEl) sourceSystemIdEl.value = '';
        return;
      }
      if (matched && matched.level) {
        const nameParts = inputVal.split(' - ');
        if (sourceSystemIdEl) sourceSystemIdEl.value = nameParts.length > 1 ? nameParts[0].trim() : '';
        const levelSelect = document.getElementById('systemLevel');
        if (levelSelect && levelSelect.value !== matched.level) {
          levelSelect.value = matched.level;
          renderAssetOptionsDatalist(); // 同步更新 datalist
        }
      }
    }

    function validateLocalLocationSelection(activeTargets) {
      if (!Array.isArray(assetOptionsData) || assetOptionsData.length === 0) return true;
      const validNames = assetOptionsData.map(item => item.name);

      for (const t of activeTargets) {
        const inputId = t.id === 'log' ? `logLocalLoc_${t.id}` : `localLoc_${t.id}`;
        const input = document.getElementById(inputId);
        if (!input) continue;

        const value = String(input.value || '').trim();
        if (!value) continue; // required 屬性會先擋空值
        if (!validNames.includes(value)) {
          alert(`「${t.name}」的本地存放地點/設備請從下拉選單選擇有效的資訊資產。`);
          input.focus();
          return false;
        }
      }
      return true;
    }

    // --- 每次均直接從後端 Google Sheet 讀取最新資料，不使用 localStorage 快取 ---
    function loadDashboardData(options = {}) {
      const showProgress = Boolean(options.showProgress);
      if (showProgress) startDashboardLoading();

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.success && Array.isArray(response.data)) {
              appData = response.data;
              dashboardLoadError = null;
            } else {
              appData = [];
              const errMsg = (response && response.message) ? response.message : '後端讀取資料失敗。';
              dashboardLoadError = errMsg;
              console.warn('[loadDashboardData] 後端回傳失敗：', errMsg);
            }
            if (showProgress) {
              finishDashboardLoading();
            }
            renderDashboard();
          })
          .withFailureHandler(function(error) {
            appData = [];
            const errMsg = (error && error.message) ? error.message : '連線逾時或後端拋出例外。';
            dashboardLoadError = errMsg;
            console.error('[loadDashboardData] RPC 呼叫失敗：', errMsg);
            if (showProgress) {
              finishDashboardLoading();
            }
            renderDashboard();
          })
          .getDashboardData();
      } else {
        // 本地純靜態瀏覽預覽環境
        appData = [];
        dashboardLoadError = null;
        if (showProgress) {
          finishDashboardLoading();
        }
        renderDashboard();
      }
    }

    function setDashboardLoadingProgress(value) {
      const clamped = Math.max(0, Math.min(100, Number(value) || 0));
      dashboardLoadProgress = clamped;

      const bar = document.getElementById('dashboardLoadingBar');
      const text = document.getElementById('dashboardLoadingText');
      if (bar) {
        bar.style.width = `${clamped}%`;
        bar.setAttribute('aria-valuenow', String(clamped));
      }
      if (text) {
        text.innerText = `${clamped}%`;
      }
    }

    function startDashboardLoading() {
      const loading = document.getElementById('dashboardLoading');
      if (loading) {
        loading.classList.remove('hidden');
      }

      if (dashboardLoadTimer) {
        clearInterval(dashboardLoadTimer);
        dashboardLoadTimer = null;
      }

      setDashboardLoadingProgress(0);
      dashboardLoadTimer = setInterval(() => {
        if (dashboardLoadProgress >= 90) {
          clearInterval(dashboardLoadTimer);
          dashboardLoadTimer = null;
          return;
        }
        setDashboardLoadingProgress(dashboardLoadProgress + 4);
      }, 80);
    }

    function finishDashboardLoading() {
      if (dashboardLoadTimer) {
        clearInterval(dashboardLoadTimer);
        dashboardLoadTimer = null;
      }

      setDashboardLoadingProgress(100);
      setTimeout(() => {
        const loading = document.getElementById('dashboardLoading');
        if (loading) {
          loading.classList.add('hidden');
        }
      }, 250);
    }

    // --- 視圖切換邏輯 ---
    function switchTab(tabName) {
      const dashboardView = document.getElementById('dashboardView');
      const formView = document.getElementById('formView');
      const tabDashboard = document.getElementById('tab-dashboard');
      const tabForm = document.getElementById('tab-form');

      if (tabName === 'dashboard') {
        dashboardView.classList.remove('hidden');
        formView.classList.add('hidden');
        tabDashboard.className = 'nav-active px-3 py-2 flex items-center transition-colors duration-200';
        tabForm.className = 'nav-inactive px-3 py-2 flex items-center transition-colors duration-200 ml-4';
        renderDashboard(); // 確保重新渲染最新數據
      } else {
        dashboardView.classList.add('hidden');
        formView.classList.remove('hidden');
        tabForm.className = 'nav-active px-3 py-2 flex items-center transition-colors duration-200 ml-4';
        tabDashboard.className = 'nav-inactive px-3 py-2 flex items-center transition-colors duration-200';
        
        // 只有在按下「新增設定」Tab 時才重置表單 (如果是編輯進來的，保留資料)
        if (!document.getElementById('submissionId').value) {
          resetForm();
        }
      }
    }

    // --- 渲染儀表板 ---
    function renderDashboard() {
      const container = document.getElementById('systemCardsContainer');
      const emptyState = document.getElementById('emptyState');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      // 統計變數
      let criticalCount = 0;
      let totalTargetsCount = 0;
      
      // 篩選資料
      const filteredData = appData.filter(sys => {
        const systemName = String(sys.systemName || '');
        const managerName = String(sys.managerName || '');
        const targets = Array.isArray(sys.targets) ? sys.targets : [];

        if (sys.systemLevel === '關鍵核心系統') criticalCount++;
        totalTargetsCount += targets.length;
        
        return systemName.toLowerCase().includes(searchTerm) || 
               managerName.toLowerCase().includes(searchTerm);
      });

      // 更新統計指標 (依據原始全量資料來顯示整體統計會更好，這裡展示全量統計)
      criticalCount = appData.filter(s => s.systemLevel === '關鍵核心系統').length;
      totalTargetsCount = appData.reduce((sum, sys) => sum + (Array.isArray(sys.targets) ? sys.targets.length : 0), 0);
      
      document.getElementById('statTotal').innerText = appData.length;
      document.getElementById('statCritical').innerText = criticalCount;
      document.getElementById('statTargets').innerText = totalTargetsCount;

      if (filteredData.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        const emptyBtn = emptyState.querySelector('button');
        if (dashboardLoadError) {
          emptyState.querySelector('h3').innerText = '資料載入失敗';
          emptyState.querySelector('p').innerText = dashboardLoadError;
          if (emptyBtn) {
            emptyBtn.innerText = '重試載入';
            emptyBtn.onclick = () => loadDashboardData({ showProgress: true });
            emptyBtn.classList.remove('hidden');
          }
        } else if (appData.length > 0) {
          emptyState.querySelector('h3').innerText = '找不到符合條件的系統';
          emptyState.querySelector('p').innerText = '請嘗試其他的搜尋關鍵字。';
          if (emptyBtn) emptyBtn.classList.add('hidden');
        } else {
          emptyState.querySelector('h3').innerText = '目前尚無備份設定';
          emptyState.querySelector('p').innerText = '點擊上方「新增設定」開始建立第一筆紀錄。';
          if (emptyBtn) {
            emptyBtn.innerText = '立即新增';
            emptyBtn.onclick = () => switchTab('form');
            emptyBtn.classList.remove('hidden');
          }
        }
        return;
      }

      emptyState.classList.add('hidden');
      
      // 渲染卡片
      let html = '';
      filteredData.forEach(sys => {
        const isCritical = sys.systemLevel === '關鍵核心系統';
        const badgeColor = isCritical ? 'bg-red-100 text-red-800 border-red-200' : 'bg-blue-100 text-blue-800 border-blue-200';
        
        // 渲染備份標的詳情

              </button>
              <button data-action="delete" data-id="${escapeHtml(sys.id)}" class="px-3 py-1.5 text-sm font-medium text-red-600 bg-white border border-red-200 rounded hover:bg-red-50 transition">

      container.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteSystem(btn.dataset.id));

    // --- 刪除系統（後端封存並刪除，前端連動） ---
    function deleteSystem(id) {
      const targetSystem = appData.find(s => s.id === id);
      const systemTitle = targetSystem ? targetSystem.systemName : '此系統';

      if (!confirm(`確定要刪除「${systemTitle}」的備份設定嗎？\n\n系統將自動將舊設定封存至「備份管制_歷程」工作表，並從目前清單中永久移除。`)) {
        return;
      }

      // 取得觸發刪除的按鈕並設為處理中狀態，防止重複點擊
      const deleteBtn = document.querySelector(`button[data-action="delete"][data-id="${id}"]`);
      if (deleteBtn) {
        deleteBtn.disabled = true;
        deleteBtn.innerText = '刪除中...';
        deleteBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.success === true) {
              appData = appData.filter(s => s.id !== id);
              renderDashboard();
              alert(response.message || '系統備份設定已成功刪除並封存！');
            } else {
              const errMsg = (response && response.message) ? response.message : '後端刪除失敗。';
              alert('刪除失敗：' + errMsg);
              loadDashboardData();
            }
          })
          .withFailureHandler(function(error) {
            const errMsg = (error && error.message) ? error.message : '連線失敗或後端拋出例外。';
            alert('刪除請求失敗：' + errMsg);
            loadDashboardData();
          })
          .deleteSubmission(id);
      } else {
        // 本地模擬刪除
        setTimeout(() => {
          appData = appData.filter(s => s.id !== id);
          renderDashboard();
          alert('（本地測試環境）設定已刪除。');
        }, 300);
      }
    }

    // --- 編輯系統 (載入資料至表單) ---
    function editSystem(id) {
      const sys = appData.find(s => s.id === id);
      if(!sys) return;

      // 切換至表單視圖，並改變標題與按鈕狀態
      switchTab('form');
      document.getElementById('formTitle').innerText = `編輯系統備份設定：${sys.systemName}`;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('submitBtn').innerText = '更新儲存紀錄';
      document.getElementById('submissionId').value = sys.id;
      document.getElementById('sourceSystemId').value = sys.systemId || '';

      // 填入基本資料
      document.getElementById('systemName').value = sys.systemName;
      document.getElementById('systemLevel').value = sys.systemLevel;
      document.getElementById('managerName').value = sys.managerName;

      // 先重置所有卡片狀態為未選
      backupTargets.forEach(t => {
        document.getElementById(`check_${t.id}`).checked = false;
        toggleTarget(t.id);
      });

      // 填入標的資料
      sys.targets.forEach(tData => {
        const targetDef = backupTargets.find(b => b.id === tData.targetKey) || backupTargets.find(b => b.name === tData.targetName);
        if(targetDef) {
          const tid = targetDef.id;
          // 勾選並展開卡片
          document.getElementById(`check_${tid}`).checked = true;
          toggleTarget(tid);

          // 填值
          // 本地存放地點
          if (tid === 'log') {
            // 解析 "保存 X 單位"
            if(tData.logRetention) {
              const parts = tData.logRetention.replace('保存 ', '').split(' ');
              if(parts.length >= 2) {
                document.getElementById(`logRetVal_${tid}`).value = parts[0];
                document.getElementById(`logRetUnit_${tid}`).value = parts[1];
              }
            }
            document.getElementById(`logLocalLoc_${tid}`).value = tData.localLocation;

            // 本地日誌排程回填
            const parsed = parseScheduleString(tData.localScheduleTime, '天');
            const fullTimeEl = document.getElementById(`fullSchedTime_${tid}`);
            if (fullTimeEl) fullTimeEl.value = parsed.full.time || '00:00';
          } else {
            document.getElementById(`diffValue_${tid}`).value = tData.localDiffValue === 'N/A' ? '' : tData.localDiffValue;
            document.getElementById(`diffUnit_${tid}`).value = tData.localDiffUnit;
            document.getElementById(`fullValue_${tid}`).value = tData.localFullValue === 'N/A' ? '' : tData.localFullValue;
            document.getElementById(`fullUnit_${tid}`).value = tData.localFullUnit;
            const isAllRetention = String(tData.localRetention || '').trim() === 'ALL' || String(tData.localRetention || '').trim() === '全部保留';
            document.getElementById(`localRetAll_${tid}`).checked = isAllRetention;
            document.getElementById(`localRet_${tid}`).value = (!isAllRetention && tData.localRetention !== 'N/A') ? tData.localRetention : '';
            toggleLocalRetentionMode(tid);
            document.getElementById(`localLoc_${tid}`).value = tData.localLocation;

            // 一般標的本地排程回填 (完整軌與差異軌)
            const parsed = parseScheduleString(tData.localScheduleTime, tData.localFullUnit || '天');
            const fwEl = document.getElementById(`fullSchedWeekday_${tid}`);
            const fmEl = document.getElementById(`fullSchedMonth_${tid}`);
            const fdEl = document.getElementById(`fullSchedDay_${tid}`);
            const ftEl = document.getElementById(`fullSchedTime_${tid}`);
            if (fwEl) fwEl.value = parsed.full.weekday || '日';
            if (fmEl) fmEl.value = parsed.full.month || '12';
            if (fdEl) fdEl.value = parsed.full.day || '1';
            if (ftEl) ftEl.value = parsed.full.time || '00:00';

            const dwEl = document.getElementById(`diffSchedWeekday_${tid}`);
            const dmEl = document.getElementById(`diffSchedMonth_${tid}`);
            const ddEl = document.getElementById(`diffSchedDay_${tid}`);
            const dtEl = document.getElementById(`diffSchedTime_${tid}`);
            if (dwEl) dwEl.value = parsed.diff.weekday || '日';
            if (dmEl) dmEl.value = parsed.diff.month || '12';
            if (ddEl) ddEl.value = parsed.diff.day || '1';
            if (dtEl) dtEl.value = parsed.diff.time || '00:00';

            updateSchedulePickerUI(tid, 'full', tData.localFullUnit || '天');
            updateSchedulePickerUI(tid, 'diff', tData.localDiffUnit || '天');
            updateDiffPickerVisibility(tid);

            // 避免 updateSchedulePickerUI 覆蓋已解析之月／日
            if (fmEl && parsed.full.month) fmEl.value = parsed.full.month;
            if (fdEl && parsed.full.day) fdEl.value = parsed.full.day;
            if (dmEl && parsed.diff.month) dmEl.value = parsed.diff.month;
            if (ddEl && parsed.diff.day) ddEl.value = parsed.diff.day;
          }

          // 本地到期銷毀方法與銷毀確認方式回填
          const elLocalDisp = document.getElementById(`localDispositionMethod_${tid}`);
          const elLocalEvid = document.getElementById(`localEvidenceRequirements_${tid}`);
          setChoiceSelectValue_(elLocalDisp, tData.localDispositionMethod, '磁碟自動覆寫');
          setChoiceSelectValue_(elLocalEvid, tData.localEvidenceRequirements, '備份系統執行Log');

          // 異地存放設定
          if (tData.isOffsite === '是') {
            const radioYes = document.querySelector(`input[name="offsite_${tid}"][value="是"]`);
            if (radioYes) radioYes.checked = true;
            toggleOffsite(tid, true);
            const freqValEl = document.getElementById(`offsiteFreqValue_${tid}`);
            const freqUnitEl = document.getElementById(`offsiteFreqUnit_${tid}`);
            const locEl = document.getElementById(`offsiteLoc_${tid}`);
            const retEl = document.getElementById(`offsiteRet_${tid}`);
            const elOffDisp = document.getElementById(`offsiteDispositionMethod_${tid}`);
            const elOffEvid = document.getElementById(`offsiteEvidenceRequirements_${tid}`);

            if (freqValEl) freqValEl.value = tData.offsiteFreqValue;
            if (freqUnitEl) freqUnitEl.value = tData.offsiteFreqUnit;
            if (locEl) locEl.value = tData.offsiteLocation;
            if (retEl) retEl.value = tData.offsiteRetention;
            setChoiceSelectValue_(elOffDisp, tData.offsiteDispositionMethod, '磁碟自動覆寫');
            setChoiceSelectValue_(elOffEvid, tData.offsiteEvidenceRequirements, '備份系統執行Log');

            const offParsed = parseScheduleString(tData.offsiteScheduleTime, tData.offsiteFreqUnit || '天');
            const owEl = document.getElementById(`offsiteSchedWeekday_${tid}`);
            const omEl = document.getElementById(`offsiteSchedMonth_${tid}`);
            const odEl = document.getElementById(`offsiteSchedDay_${tid}`);
            const otEl = document.getElementById(`offsiteSchedTime_${tid}`);
            if (owEl) owEl.value = offParsed.full.weekday || '日';
            if (omEl) omEl.value = offParsed.full.month || '12';
            if (odEl) odEl.value = offParsed.full.day || '1';
            if (otEl) otEl.value = offParsed.full.time || '00:00';

            updateSchedulePickerUI(tid, 'offsite', tData.offsiteFreqUnit || '天');
            if (omEl && offParsed.full.month) omEl.value = offParsed.full.month;
            if (odEl && offParsed.full.day) odEl.value = offParsed.full.day;
          } else {
            const radioNo = document.querySelector(`input[name="offsite_${tid}"][value="否"]`);
            if (radioNo) radioNo.checked = true;
            toggleOffsite(tid, false);
            const elOffDisp = document.getElementById(`offsiteDispositionMethod_${tid}`);
            const elOffEvid = document.getElementById(`offsiteEvidenceRequirements_${tid}`);
            resetChoiceSelect_(elOffDisp, '磁碟自動覆寫');
            resetChoiceSelect_(elOffEvid, '備份系統執行Log');

            const owEl = document.getElementById(`offsiteSchedWeekday_${tid}`);
            const omEl = document.getElementById(`offsiteSchedMonth_${tid}`);
            const odEl = document.getElementById(`offsiteSchedDay_${tid}`);
            const otEl = document.getElementById(`offsiteSchedTime_${tid}`);
            if (owEl) owEl.value = '日';
            if (omEl) omEl.value = '12';
            if (odEl) odEl.value = '1';
            if (otEl) otEl.value = '00:00';

            updateSchedulePickerUI(tid, 'offsite', '天');
          }

          // 同步排程至隱藏 input 與預覽標籤
          syncTargetSchedule(tid);
          if (tData.isOffsite !== '是') {
            const elOffSched = document.getElementById(`offsiteScheduleTime_${tid}`);
            if (elOffSched) elOffSched.value = '無';
            const elOffPrev = document.getElementById(`offsiteSchedulePreview_${tid}`);
            if (elOffPrev) elOffPrev.textContent = '排程設定值: 無';
          }
        }
      });
      
      // 滾動到頂部
      window.scrollTo(0, 0);
    }

    // --- 取消編輯 ---
    function cancelEdit() {
      resetForm();
      switchTab('dashboard');
    }

    // --- 重置表單為預設狀態 ---
    function resetForm() {
      const form = document.getElementById('backupForm');
      if (form) form.reset();
      const submissionIdEl = document.getElementById('submissionId');
      if (submissionIdEl) submissionIdEl.value = '';
      const sourceSystemIdEl = document.getElementById('sourceSystemId');
      if (sourceSystemIdEl) sourceSystemIdEl.value = '';
      const formTitleEl = document.getElementById('formTitle');
      if (formTitleEl) formTitleEl.innerText = '新增備份管制設定單';
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      if (cancelEditBtn) cancelEditBtn.classList.add('hidden');
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.innerText = '儲存並送出紀錄';
      
      backupTargets.forEach(t => {
        toggleTarget(t.id);
        toggleOffsite(t.id, false);

        // 重置各軌控制項數值為標準預設值
        const tracks = t.id === 'log' ? ['full', 'offsite'] : ['full', 'diff', 'offsite'];
        tracks.forEach(track => {
          const timeEl = document.getElementById(`${track}SchedTime_${t.id}`);
          const weekdayEl = document.getElementById(`${track}SchedWeekday_${t.id}`);
          const monthEl = document.getElementById(`${track}SchedMonth_${t.id}`);
          const dayEl = document.getElementById(`${track}SchedDay_${t.id}`);
          if (timeEl) timeEl.value = '00:00';
          if (weekdayEl) weekdayEl.value = '日';
          if (monthEl) monthEl.value = '12';
          if (dayEl) dayEl.value = '1';
        });

        // 重設單位 UI 與可見度
        updateSchedulePickerUI(t.id, 'full', '天');
        if (t.id !== 'log') {
          const diffValEl = document.getElementById(`diffValue_${t.id}`);
          if (diffValEl) diffValEl.value = '';
          updateSchedulePickerUI(t.id, 'diff', '天');
          updateDiffPickerVisibility(t.id);
        }
        updateSchedulePickerUI(t.id, 'offsite', '天');

        // 同步排程
        syncTargetSchedule(t.id);

        const elLocalSched = document.getElementById(`localScheduleTime_${t.id}`);
        const elLocalDisp = document.getElementById(`localDispositionMethod_${t.id}`);
        const elLocalEvid = document.getElementById(`localEvidenceRequirements_${t.id}`);
        if (elLocalSched) elLocalSched.value = '每日 00:00';
        resetChoiceSelect_(elLocalDisp, '磁碟自動覆寫');
        resetChoiceSelect_(elLocalEvid, '備份系統執行Log');

        const elOffSched = document.getElementById(`offsiteScheduleTime_${t.id}`);
        const elOffDisp = document.getElementById(`offsiteDispositionMethod_${t.id}`);
        const elOffEvid = document.getElementById(`offsiteEvidenceRequirements_${t.id}`);
        if (elOffSched) elOffSched.value = '無';
        const elOffPrev = document.getElementById(`offsiteSchedulePreview_${t.id}`);
        if (elOffPrev) elOffPrev.textContent = '排程設定值: 無';
        resetChoiceSelect_(elOffDisp, '磁碟自動覆寫');
        resetChoiceSelect_(elOffEvid, '備份系統執行Log');
      });
    }

                  ${renderSchedulePickerTrackHtml(target.id, 'diff', '差異排程:')}
                  <input type="hidden" id="localScheduleTime_${target.id}" value="每日 00:00">
                  <div class="text-xs text-blue-600 font-mono mt-1" id="localSchedulePreview_${target.id}">排程設定值: 每日 00:00</div>
                </div>
              </div>
              <div class="flex flex-col mt-2">
                <label class="block text-sm font-medium text-gray-600 mb-1">到期銷毀方法 <span class="text-red-500">*</span></label>
                ${renderChoiceSelectHtml_(`localDispositionMethod_${target.id}`, DISPOSITION_METHOD_OPTIONS, 'block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white focus:ring-blue-500')}
              </div>
              <div class="flex flex-col mt-2">
                <label class="block text-sm font-medium text-gray-600 mb-1">銷毀確認方式 <span class="text-red-500">*</span></label>
                ${renderChoiceSelectHtml_(`localEvidenceRequirements_${target.id}`, EVIDENCE_REQUIREMENT_OPTIONS, 'block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white focus:ring-blue-500')}
              </div>
            </div>
          `;
        }

        html += `
          <div class="target-card border border-gray-200 rounded-xl bg-white shadow-sm overflow-hidden">
            <!-- 卡片標頭 (開關) -->
            <label class="p-4 bg-gray-50 flex items-center justify-between border-b border-gray-200 cursor-pointer hover:bg-gray-100 transition">
              <div class="flex items-center">
                <input type="checkbox" id="check_${target.id}" onchange="toggleTarget('${target.id}')" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
                <span class="ml-3 text-lg font-bold text-gray-700">${target.name}</span>
              </div>
              <span id="badge_${target.id}" class="px-3 py-1 text-xs font-semibold rounded-full bg-gray-200 text-gray-500 border border-gray-300">
                無此標的
              </span>
            </label>

            <!-- 卡片內容 (預設隱藏) -->
            <div id="details_${target.id}" class="hidden-section p-6 bg-white">
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                ${localBackupHtml}

                <!-- 異地存放設定 -->
                <div class="space-y-4 bg-purple-50 p-4 rounded-lg border border-purple-100">
                  <div class="flex items-center justify-between border-b border-purple-200 pb-2">
                    <h4 class="font-semibold text-purple-800">異地存放/備份設定</h4>
                    <div class="flex items-center space-x-4 text-sm">
                      <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="offsite_${target.id}" value="是" onchange="toggleOffsite('${target.id}', true)" class="form-radio text-purple-600">
                        <span class="ml-1 text-purple-900">是</span>
                      </label>
                      <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="offsite_${target.id}" value="否" onchange="toggleOffsite('${target.id}', false)" checked class="form-radio text-purple-600">
                        <span class="ml-1 text-purple-900">否</span>
                      </label>
                    </div>
                  </div>

                  <!-- 異地隱藏區塊 -->
                  <div id="offsiteSection_${target.id}" class="hidden-section space-y-4 pt-2">
                    <div class="flex flex-col">
                      <label class="block text-sm font-medium text-purple-800 mb-1">每 ___ 執行「異地存放」 <span class="text-red-500">*</span></label>
                      <div class="flex">
                        <input type="number" id="offsiteFreqValue_${target.id}" min="1" class="block w-20 rounded-l-md border-purple-300 shadow-sm p-2 border text-center focus:ring-purple-500">
                        <select id="offsiteFreqUnit_${target.id}" onchange="updateSchedulePickerUI('${target.id}', 'offsite', this.value); syncTargetSchedule('${target.id}');" class="block w-full rounded-r-md border-purple-300 shadow-sm p-2 border border-l-0 bg-white">
                          <option value="天">天</option><option value="週">週</option><option value="個月">個月</option><option value="年">年</option><option value="版本">版本</option>
                        </select>
                      </div>
                    </div>
                    
                    <div>
                      <label class="block text-sm font-medium text-purple-800 mb-1">異地存放地點 <span class="text-red-500">*</span></label>
                      <input type="text" id="offsiteLoc_${target.id}" placeholder="例如: 國家高速網路中心" class="block w-full rounded-md border-purple-300 shadow-sm p-2 border focus:ring-purple-500">
                    </div>

                    <div class="flex items-center">
                      <label class="block text-sm font-medium text-purple-800 mr-3">異地保留代數 <span class="text-red-500">*</span></label>
                      <input type="number" id="offsiteRet_${target.id}" min="1" class="block w-20 rounded-md border-purple-300 shadow-sm p-2 border text-center focus:ring-purple-500">
                      <span class="ml-2 text-sm text-purple-700">代</span>
                    </div>

                    <div>
                      <label class="block text-sm font-medium text-purple-800 mb-1">異地排程時間 <span class="text-red-500">*</span></label>
                      <div class="offsite-schedule-composite space-y-2">
                        ${renderSchedulePickerTrackHtml(target.id, 'offsite', '異地排程:')}
                        <input type="hidden" id="offsiteScheduleTime_${target.id}" value="每日 00:00">
                        <div class="text-xs text-purple-700 font-mono mt-1" id="offsiteSchedulePreview_${target.id}">排程設定值: 每日 00:00</div>
                      </div>
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-purple-800 mb-1">到期銷毀方法 <span class="text-red-500">*</span></label>
                      ${renderChoiceSelectHtml_(`offsiteDispositionMethod_${target.id}`, DISPOSITION_METHOD_OPTIONS, 'block w-full rounded-md border-purple-300 shadow-sm p-2 border bg-white focus:ring-purple-500')}
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-purple-800 mb-1">銷毀確認方式 <span class="text-red-500">*</span></label>
                      ${renderChoiceSelectHtml_(`offsiteEvidenceRequirements_${target.id}`, EVIDENCE_REQUIREMENT_OPTIONS, 'block w-full rounded-md border-purple-300 shadow-sm p-2 border bg-white focus:ring-purple-500')}
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        `;
      });

      if (container) {
        container.innerHTML = html;

        // 初始化各標的之排程選擇器狀態
        backupTargets.forEach(target => {
          if (target.id !== 'log') {
            const fullUnitEl = document.getElementById(`fullUnit_${target.id}`);
            const fullUnit = fullUnitEl ? fullUnitEl.value : '天';
            const diffUnitEl = document.getElementById(`diffUnit_${target.id}`);
            const diffUnit = diffUnitEl ? diffUnitEl.value : '天';
            updateSchedulePickerUI(target.id, 'full', fullUnit);
            updateSchedulePickerUI(target.id, 'diff', diffUnit);
            updateDiffPickerVisibility(target.id);
          }
          const offsiteUnitEl = document.getElementById(`offsiteFreqUnit_${target.id}`);
          const offsiteUnit = offsiteUnitEl ? offsiteUnitEl.value : '天';
          updateSchedulePickerUI(target.id, 'offsite', offsiteUnit);
          syncTargetSchedule(target.id);
        });
      }
    }

    // 控制「個別標的」卡片的展開與必填邏輯
    function toggleTarget(targetId) {
      const elCheck = document.getElementById(`check_${targetId}`);
      if (!elCheck) return;
      
      const isChecked = elCheck.checked;
      const details = document.getElementById(`details_${targetId}`);
      const badge = document.getElementById(`badge_${targetId}`);

      if (isChecked) {
        details.style.display = 'block';
        badge.innerText = '已啟用並設定';
        badge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-700 border border-green-300';
        
        if (targetId === 'log') {
          document.getElementById(`logRetVal_${targetId}`).required = true;
          document.getElementById(`logLocalLoc_${targetId}`).required = true;
        } else {
          document.getElementById(`fullValue_${targetId}`).required = true;
          const isAllRetention = document.getElementById(`localRetAll_${targetId}`).checked;
          document.getElementById(`localRet_${targetId}`).required = !isAllRetention;
          document.getElementById(`localLoc_${targetId}`).required = true;
        }

        const elLocalSched = document.getElementById(`localScheduleTime_${targetId}`);
        const elLocalDisp = document.getElementById(`localDispositionMethod_${targetId}`);
        const elLocalEvid = document.getElementById(`localEvidenceRequirements_${targetId}`);
        if (elLocalSched && elLocalSched.type !== 'hidden') elLocalSched.required = true;
        if (elLocalDisp) elLocalDisp.required = true;
        if (elLocalEvid) elLocalEvid.required = true;
      } else {
        details.style.display = 'none';
        badge.innerText = '無此標的';
        badge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-gray-200 text-gray-500 border border-gray-300';
        
        if (targetId === 'log') {
          document.getElementById(`logRetVal_${targetId}`).required = false;
          document.getElementById(`logLocalLoc_${targetId}`).required = false;
        } else {
          document.getElementById(`fullValue_${targetId}`).required = false;
          document.getElementById(`localRet_${targetId}`).required = false;
          document.getElementById(`localLoc_${targetId}`).required = false;
          document.getElementById(`localRetAll_${targetId}`).checked = false;
          toggleLocalRetentionMode(targetId);
        }

        const elLocalSched = document.getElementById(`localScheduleTime_${targetId}`);
        const elLocalDisp = document.getElementById(`localDispositionMethod_${targetId}`);
        const elLocalEvid = document.getElementById(`localEvidenceRequirements_${targetId}`);
        if (elLocalSched) {
          if (elLocalSched.type !== 'hidden') elLocalSched.required = false;
          elLocalSched.value = '每日 00:00';
        }
        if (elLocalDisp) elLocalDisp.required = false;
        if (elLocalEvid) elLocalEvid.required = false;
        resetChoiceSelect_(elLocalDisp, '磁碟自動覆寫');
        resetChoiceSelect_(elLocalEvid, '備份系統執行Log');
        
        document.querySelector(`input[name="offsite_${targetId}"][value="否"]`).checked = true;
        toggleOffsite(targetId, false);
      }
    }

    function toggleLocalRetentionMode(targetId) {
      const allRetentionCheckbox = document.getElementById(`localRetAll_${targetId}`);
      const localRetentionInput = document.getElementById(`localRet_${targetId}`);
      const targetCheckbox = document.getElementById(`check_${targetId}`);
      if (!allRetentionCheckbox || !localRetentionInput || !targetCheckbox) return;

      const isAllRetention = allRetentionCheckbox.checked;
      localRetentionInput.disabled = isAllRetention;
      localRetentionInput.required = !isAllRetention && targetCheckbox.checked;
      localRetentionInput.classList.toggle('bg-gray-100', isAllRetention);
      localRetentionInput.classList.toggle('text-gray-400', isAllRetention);
      if (isAllRetention) {
        localRetentionInput.value = '';
      }
    }

    // 控制個別標的內的「異地存放」區塊顯示與必填邏輯
    function toggleOffsite(targetId, show) {
      const section = document.getElementById(`offsiteSection_${targetId}`);
      if (!section) return;
      
      const requiredFieldIds = [
        `offsiteFreqValue_${targetId}`,
        `offsiteLoc_${targetId}`,
        `offsiteRet_${targetId}`,
        `offsiteDispositionMethod_${targetId}`,
        `offsiteEvidenceRequirements_${targetId}`
      ];
      if (show) {
        section.style.display = 'block';
        requiredFieldIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.required = true;
        });
        syncTargetSchedule(targetId);
      } else {
        section.style.display = 'none';
        requiredFieldIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.required = false;
        });
        const offSched = document.getElementById(`offsiteScheduleTime_${targetId}`);
        const offDisp = document.getElementById(`offsiteDispositionMethod_${targetId}`);
        const offEvid = document.getElementById(`offsiteEvidenceRequirements_${targetId}`);
        if (offSched) offSched.value = '無';
        const offPrev = document.getElementById(`offsiteSchedulePreview_${targetId}`);
        if (offPrev) offPrev.textContent = '排程設定值: 無';
        resetChoiceSelect_(offDisp, '磁碟自動覆寫');
        resetChoiceSelect_(offEvid, '備份系統執行Log');
      }
    }

    // 處理表單送出
    function handleFormSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      const submissionId = document.getElementById('submissionId').value;
      
      const activeTargets = backupTargets.filter(t => document.getElementById(`check_${t.id}`).checked);
      
      if (activeTargets.length === 0) {
        alert("請至少勾選一項「備份標的」進行設定！");
        return;
      }
      if (!validateLocalLocationSelection(activeTargets)) {
        return;
      }

      // 送出前強制執行 syncTargetSchedule 確保所有標的排程字串更新為合法標準格式
      activeTargets.forEach(t => {
        syncTargetSchedule(t.id);
      });

      submitBtn.disabled = true;
      submitBtn.innerText = '資料處理中...';
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

      const targetsData = activeTargets.map(t => {
        const isOffsite = document.querySelector(`input[name="offsite_${t.id}"]:checked`).value;
        let logRetention = '';
        if (t.id === 'log') {
          logRetention = '保存 ' + document.getElementById(`logRetVal_${t.id}`).value + ' ' + document.getElementById(`logRetUnit_${t.id}`).value;
        }

        const localScheduleEl = document.getElementById(`localScheduleTime_${t.id}`);
        const localDispEl = document.getElementById(`localDispositionMethod_${t.id}`);
        const localEvidEl = document.getElementById(`localEvidenceRequirements_${t.id}`);
        const offsiteScheduleEl = document.getElementById(`offsiteScheduleTime_${t.id}`);
        const offsiteDispEl = document.getElementById(`offsiteDispositionMethod_${t.id}`);
        const offsiteEvidEl = document.getElementById(`offsiteEvidenceRequirements_${t.id}`);

        return {
          targetKey: t.id,
          targetName: t.name,
          localDiffValue: t.id !== 'log' ? (document.getElementById(`diffValue_${t.id}`).value || '0') : '不適用',
          localDiffUnit: t.id !== 'log' ? document.getElementById(`diffUnit_${t.id}`).value : '',
          localFullValue: t.id !== 'log' ? document.getElementById(`fullValue_${t.id}`).value : '不適用',
          localFullUnit: t.id !== 'log' ? document.getElementById(`fullUnit_${t.id}`).value : '',
          localRetention: t.id !== 'log'
            ? (document.getElementById(`localRetAll_${t.id}`).checked ? 'ALL' : document.getElementById(`localRet_${t.id}`).value)
            : logRetention,
          localLocation: t.id !== 'log' ? document.getElementById(`localLoc_${t.id}`).value : document.getElementById(`logLocalLoc_${t.id}`).value,
          localScheduleTime: localScheduleEl ? (localScheduleEl.value.trim() || '每日 00:00') : '每日 00:00',
          localDispositionMethod: localDispEl ? (localDispEl.value.trim() || '磁碟自動覆寫') : '磁碟自動覆寫',
          localEvidenceRequirements: localEvidEl ? (localEvidEl.value.trim() || '備份系統執行Log') : '備份系統執行Log',
          logRetention: logRetention,
          isOffsite: isOffsite,
          offsiteFreqValue: isOffsite === '是' ? document.getElementById(`offsiteFreqValue_${t.id}`).value : '',
          offsiteFreqUnit: isOffsite === '是' ? document.getElementById(`offsiteFreqUnit_${t.id}`).value : '',
          offsiteLocation: isOffsite === '是' ? document.getElementById(`offsiteLoc_${t.id}`).value : '',
          offsiteRetention: isOffsite === '是' ? document.getElementById(`offsiteRet_${t.id}`).value : '',
          offsiteScheduleTime: isOffsite === '是' ? (offsiteScheduleEl ? (offsiteScheduleEl.value.trim() || '每日 00:00') : '每日 00:00') : '無',
          offsiteDispositionMethod: isOffsite === '是' ? (offsiteDispEl ? (offsiteDispEl.value.trim() || '磁碟自動覆寫') : '磁碟自動覆寫') : '無',
          offsiteEvidenceRequirements: isOffsite === '是' ? (offsiteEvidEl ? (offsiteEvidEl.value.trim() || '備份系統執行Log') : '備份系統執行Log') : '無'
        };
      });

      const formData = {
        id: submissionId || '', // 新增時由後端產生 submission_id
        systemId: document.getElementById('sourceSystemId').value,
        systemName: document.getElementById('systemName').value,
        systemLevel: document.getElementById('systemLevel').value,
        managerName: document.getElementById('managerName').value,
        targets: targetsData
      };

      // --- 呼叫後端 Google Apps Script (如果存在) ---
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (!response || response.success !== true) {
              handleError((response && response.message) ? response.message : '後端儲存失敗。');
              return;
            }
            handleSuccess(response.message || '資料已成功儲存至試算表！');
          })
          .withFailureHandler(function(error) {
            const errMsg = (error && error.message)
              ? ('後端呼叫失敗：' + error.message)
              : '連線失敗，請檢查網路連線或稍後再試。';
            handleError(errMsg);
          })
          .submitData(formData);
      } else {
        // 本地純預覽測試環境（無 GAS 環境）
        const localId = submissionId || ('local_' + Date.now().toString());
        const localRecord = Object.assign({}, formData, { id: localId });
        if (submissionId) {
          const index = appData.findIndex(s => s.id === submissionId);
          if (index !== -1) appData[index] = localRecord;
        } else {
          appData.push(localRecord);
        }
        setTimeout(() => {
          handleSuccess(submissionId ? '系統設定已成功更新！' : '資料已成功新增！');
        }, 500);
      }

      // 內部成功處理函數
      function handleSuccess(msg) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        
        statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
        statusMessage.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
        statusMessage.innerText = msg;
        
        setTimeout(() => { 
          statusMessage.classList.add('hidden'); 
          resetForm();
          switchTab('dashboard'); // 送出成功後自動跳轉回儀表板
          loadDashboardData({ showProgress: false }); // 背景同步後端主表最新資料
        }, 1500);
      }

      // 內部錯誤處理函數
      function handleError(msg) {
        submitBtn.disabled = false;
        submitBtn.innerText = submissionId ? '更新儲存紀錄' : '儲存並送出紀錄';
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        
        statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-800');
        statusMessage.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
        statusMessage.innerText = msg;
      }
    }
  </script>
</body>
</html>
